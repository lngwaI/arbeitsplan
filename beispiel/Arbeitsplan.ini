# Arbeitsplan - Beispiel-Umgebung (liegt neben Arbeitsplan.exe im Ordner Programm). Alle Pfade zeigen in den Beispielordner.
# scripts\beispiel-bauen.cmd setzt bei "Admins=" den Windows-Namen dessen ein, der das Skript ausführt.

# Relativ zur exe: ..\daten = Ordner "daten" neben "Programm". Leer ginge auch (gleiches Ergebnis).
Datenordner=
Paketordner=
Sicherungsordner=

# Beispielnutzer: darf beim ersten Start den leeren Datenordner einrichten und wird Admin.
Admins=__LOGIN__
Pilot=1
NurLesen=0
NurLesenFuer=

# Equipment-Status aus beispiel\daten\equipstatus.csv. Großes Höchstalter, damit die Beispieldatei nicht "veraltet" ist.
Statusdatei=equipstatus.csv
StatusdateiMaxAlter=8760
ManuellTage=14

Abfrage=30
# Kein lokaler Offline-Stand (nichts in %LOCALAPPDATA%\Arbeitsplan)
CacheTage=0
SicherungAlleStunden=24
