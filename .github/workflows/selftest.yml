name: Selbsttest
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bauen (csc, wie lokal)
        shell: cmd
        run: build.cmd
      - name: Selbsttests ausfuehren
        shell: pwsh
        run: |
          if (-not (Test-Path bin\Arbeitsplan.exe)) { throw "exe fehlt" }
          $p = Start-Process bin\Arbeitsplan.exe -ArgumentList '--shot','shot.png','--selftest','selftest.txt' -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); throw "Timeout" }
          if (-not (Test-Path selftest.txt)) { throw "selftest.txt fehlt" }
          Get-Content selftest.txt
          foreach ($k in 'Schl','Datendatei','APBAK2') { if (-not (Select-String -Path selftest.txt -Pattern $k -Encoding utf8 -Quiet)) { throw "Zeile '$k' fehlt im Selbsttest" } }
          Write-Host ("Zeilen: " + (Get-Content selftest.txt).Count)
          if (Select-String -Path selftest.txt -Pattern 'FEHLER' -Quiet) { throw "Selbsttest: FEHLER" }
      - name: Verteilordner bauen (make_dist)
        shell: cmd
        run: make_dist.cmd
      - uses: actions/upload-artifact@v4
        with:
          name: Arbeitsplan-Release
          path: dist/Arbeitsplan
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: |
            selftest.txt
            shot.png
