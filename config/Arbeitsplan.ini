# Arbeitsplan - Einstellungen (liegt neben Arbeitsplan.exe im Ordner Programm). Zeilen mit # sind Kommentare.
# Gilt für alle, die das Programm von hier starten. Nach einer Änderung das Programm neu starten.

# Ordner für die Plandaten (eine verschlüsselte Datei arbeitsplan.apdb + versteckte Schlüsseldatei).
# Leer = automatisch: Ordner "daten" neben dem Ordner "Programm" (so wie ausgeliefert).
# Nur nötig, wenn die Daten woanders liegen. Immer als UNC-Pfad, nie mit Laufwerksbuchstabe, z. B.
#   Datenordner=\\Server\Freigabe\Formulierung\Arbeitsplan\daten
# Das Programm legt diesen Ordner NIE selbst an: ohne erreichbaren Datenordner startet es nicht (Schutz vor Kopien).
Datenordner=

# Windows-Anmeldenamen, die den Arbeitsplan EINMALIG einrichten dürfen (leerer Datenordner) und dabei Admin werden,
# z. B. Admins=mmuster. Danach zählen nur die Rechte aus der Nutzerverwaltung im Programm.
Admins=

# Systemrechner / Anzeige-PCs: Windows-Anmeldenamen oder Rechnernamen, die OHNE Nutzerkonto nur ansehen dürfen
# (nie speichern). Komma-getrennt, Platzhalter * und ? erlaubt, z. B. NurLesenFuer=View-Only*,SYS-*
NurLesenFuer=

# 1 = alle, die von hier starten, dürfen nur ansehen (z. B. eigene Kopie auf einem Anzeige-PC)
NurLesen=0

# Nur für eine Testphase: 1 = nicht angelegte Windows-Nutzer dürfen trotzdem bearbeiten (Paket Produktion).
# 0 (empfohlen) = nicht angelegte Nutzer bekommen eine Meldung "bitte Vorgesetzten/Admin fragen" und das Programm endet.
Pilot=0

# Alle wie viele Sekunden nach Änderungen anderer PCs geschaut wird (5 bis 3600). Beim Blättern (Heute, Pfeile) sofort.
Abfrage=30

# Wie viele Tage der lokale Offline-Stand (%LOCALAPPDATA%\Arbeitsplan\cache.apdb, nur für diesen Windows-Nutzer lesbar)
# gültig bleibt. 0 = kein lokaler Stand (dann ohne Netz gar keine Anzeige).
CacheTage=7

# Ordner für die tägliche Sicherung. Leer = <Datenordner>\sicherung
Sicherungsordner=

# Ordner für die gemeinsamen Pakete (.apkg). Leer = <Datenordner>\Pakete
Paketordner=
