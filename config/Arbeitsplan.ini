# Arbeitsplan - Einstellungen (liegt neben Arbeitsplan.exe). Zeilen mit # sind Kommentare.
# Nach einer Änderung das Programm neu starten.

# Ordner für die Plandaten (eine verschlüsselte Datei arbeitsplan.apdb).
# Leer = Unterordner "daten" neben der exe (nur für diesen Ordner/PC).
# Zum Teilen mit Kollegen: alle zeigen auf denselben Ordner, z. B.
#   Datenordner=\\Server\Freigabe\Arbeitsplan\daten
#   Datenordner=Z:\Arbeitsplan\daten
# Relativ angegeben = relativ zur exe.
Datenordner=

# 1 = nur ansehen, nie speichern (Systemrechner / Anzeige-PC)
NurLesen=0

# Pilotbetrieb: 1 = unbekannte Windows-Nutzer dürfen bearbeiten (Paket Produktion), 0 = nur lesen
Pilot=1

# Windows-Anmeldenamen mit vollen Rechten, durch Komma getrennt, z. B. Admins=mmuster,ebeispiel
Admins=

# Alle wie viele Sekunden nach Änderungen anderer PCs geschaut wird (5 bis 3600)
Abfrage=30

# Wie viele Tage der lokale Offline-Stand (%LOCALAPPDATA%\Arbeitsplan\cache.apdb) gültig bleibt. 0 = kein lokaler Stand.
CacheTage=7

# Hinweis: Der Schlüssel der Datendatei liegt als versteckte Datei arbeitsplan.key im Datenordner.
# Sie muss mit dem Ordner geschützt und gesichert werden (ohne sie sind die Daten unlesbar).

# Ordner für die tägliche Sicherung. Leer = <Datenordner>\sicherung
Sicherungsordner=
